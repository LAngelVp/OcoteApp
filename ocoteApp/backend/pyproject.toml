[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocote-backend"
version = "0.1.0"
description = "OCOTE technical API foundation (F1 only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "SQLAlchemy>=2.0.44,<2.1",
    "psycopg[binary]>=3.2.12,<4",
    "alembic>=1.17,<2",
    "pydantic-settings>=2.11,<3",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "httpx>=0.28,<1",
    "ruff>=0.14,<1",
    "pip-tools==7.5.2",
    "setuptools==80.9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requires explicitly configured local PostgreSQL roles"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]